<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game of Mouse Simulator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    header {
      padding: 20px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      padding: 20px;
    }

    .panel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 16px;
    }

    .arena {
      min-height: 600px;
      background: #f3f4f6;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    select,
    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #4b5563;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background: #111827;
      border-radius: 8px;
    }

    .chair {
      position: absolute;
      width: 34px;
      height: 34px;
      background: #6b7280;
      border: 3px solid #374151;
      border-radius: 8px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      user-select: none;
    }

    .chair.occupied {
      background: #2563eb;
    }

    .chair.empty {
      background: #f59e0b;
      border-color: #b45309;
    }

    .mouse {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #dc2626;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.6);
      user-select: none;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Game of Mouse Simulator</h1>
    <p>Human strategy simulator for testing defence against the Mouse.</p>
  </header>

  <main>

    <section class="panel">
      <h2>Simulation Controls</h2>

      <label for="strategy">Strategy</label>
      <select id="strategy">
        <option>Orchestrator</option>
        <option>Superman</option>
        <option>Circular Movement</option>
        <option>Pairs</option>
        <option>Zoning</option>
        <option>Self-Organization</option>
      </select>

      <label for="chairs">Number of Chairs</label>
      <input id="chairs" type="number" value="20" min="4" max="100">

      <label for="mouseSpeed">Mouse Speed</label>
      <input id="mouseSpeed" type="number" value="1" step="0.1">

      <label for="playerSpeed">Player Speed</label>
      <input id="playerSpeed" type="number" value="2.5" step="0.1">

      <button id="generateButton">Generate Room</button>

      <div class="status">
        <strong>Status:</strong>
        <div id="statusText">Ready</div>
      </div>
    </section>

    <section class="arena" id="arena"></section>

  </main>

  <script>
    const arena = document.getElementById('arena');
    const chairsInput = document.getElementById('chairs');
    const generateButton = document.getElementById('generateButton');
    const statusText = document.getElementById('statusText');

    const CHAIR_MIN_DISTANCE = 58;
    const MOUSE_MIN_DISTANCE = 70;
    const PADDING = 50;
    const MAX_ATTEMPTS = 5000;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function findValidPosition(existingPositions, width, height, minDistance) {
      for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
        const candidate = {
          x: randomBetween(PADDING, width - PADDING),
          y: randomBetween(PADDING, height - PADDING)
        };

        const valid = existingPositions.every(
          position => distance(candidate, position) >= minDistance
        );

        if (valid) {
          return candidate;
        }
      }

      return null;
    }

    function generateRoom() {
      arena.innerHTML = '';

      const chairCount = Math.max(
        4,
        Math.min(100, parseInt(chairsInput.value, 10) || 20)
      );

      chairsInput.value = chairCount;

      const rect = arena.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      const chairPositions = [];
      const emptyChairIndex = Math.floor(Math.random() * chairCount);

      for (let i = 0; i < chairCount; i++) {
        const position = findValidPosition(
          chairPositions,
          width,
          height,
          CHAIR_MIN_DISTANCE
        );

        if (!position) {
          statusText.textContent =
            'Could not place all chairs safely. Try fewer chairs or regenerate.';
          break;
        }

        chairPositions.push(position);

        const chair = document.createElement('div');

        chair.className =
          i === emptyChairIndex
            ? 'chair empty'
            : 'chair occupied';

        chair.textContent =
          i === emptyChairIndex
            ? '○'
            : '●';

        chair.style.left = position.x + 'px';
        chair.style.top = position.y + 'px';

        chair.dataset.index = i;
        chair.dataset.x = position.x;
        chair.dataset.y = position.y;

        arena.appendChild(chair);
      }

      const mousePosition = findValidPosition(
        chairPositions,
        width,
        height,
        MOUSE_MIN_DISTANCE
      );

      if (!mousePosition) {
        statusText.textContent =
          'Could not place the Mouse safely. Regenerate the room.';
        return;
      }

      const mouse = document.createElement('div');
      mouse.className = 'mouse';
      mouse.textContent = '🐭';

      mouse.style.left = mousePosition.x + 'px';
      mouse.style.top = mousePosition.y + 'px';

      mouse.dataset.x = mousePosition.x;
      mouse.dataset.y = mousePosition.y;

      arena.appendChild(mouse);

      statusText.textContent =
        'Room generated with safe spacing.';
    }

    generateButton.addEventListener('click', generateRoom);

    generateRoom();
  </script>

</body>
</html>
